name: Monitor Adsterra CPM

on:
  schedule:
    - cron: "0 12 * * *" # jalan tiap hari jam 12:00 UTC = 19:00 WIB
  workflow_dispatch: # bisa dijalankan manual dari tab Actions

jobs:
  run-monitor:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Run Adsterra CPM monitor
        env:
          ADSTERRA_API_KEY: ${{ secrets.ADSTERRA_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node monitor_adsterra.js
